<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>INSOMNIA · Entry Portal</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>
:root{--bg:#05091f;--bg2:#11163d;--card:rgba(18,25,52,.78);--line:rgba(221,245,255,.13);--text:#ddf5ff;--muted:#9db0c3;--cyan:#22c7c9;--gold:#ffc21a;--amber:#ff9f1c;--danger:#ff667d;--success:#45dfaa;--radius:22px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,rgba(34,199,201,.14),transparent 34%),radial-gradient(circle at 90% 0,rgba(84,45,145,.22),transparent 38%),var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}.shell{width:min(100% - 24px,1180px);margin:auto}.top{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:11px}.mark{width:16px;height:16px;border-radius:5px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 25px #ffc21a55}.brand strong{font:700 21px 'Space Grotesk';letter-spacing:.1em}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.3em}.nav{display:flex;gap:6px;flex-wrap:wrap}.nav button{background:transparent;border:1px solid transparent;color:#b9c8d6;padding:9px 11px;border-radius:11px;cursor:pointer}.nav button:hover,.nav button.active{background:#ffffff0b;color:#fff}.hero{padding:70px 0 36px;display:grid;grid-template-columns:1.15fr .85fr;gap:34px;align-items:center}.eyebrow{font-size:11px;letter-spacing:.28em;color:var(--gold);font-weight:700}.hero h1,.page h1{font:600 clamp(48px,7vw,88px)/.92 'Space Grotesk';letter-spacing:-.055em;margin:18px 0}.hero h1 span{color:var(--cyan)}.lead{color:var(--muted);font-size:17px;line-height:1.65;max-width:700px}.card,.panel{background:linear-gradient(145deg,#ffffff0b,#ffffff03);border:1px solid var(--line);border-radius:var(--radius);padding:25px;box-shadow:0 18px 60px #00000020;backdrop-filter:blur(16px)}.hero-card{text-align:center;min-height:330px;display:grid;place-items:center}.mockqr{width:210px;height:210px;border-radius:20px;background:repeating-conic-gradient(#fff 0 25%,#14265f 0 50%) 50%/28px 28px;display:grid;place-items:center;color:#071020;font-weight:800}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:1px solid #ddf5ff20;background:#ffffff08;color:var(--text);border-radius:13px;padding:12px 16px;min-height:46px;font-weight:700;cursor:pointer}.btn.primary{background:var(--gold);border-color:var(--gold);color:#071020}.btn.success{background:#45dfaa1a;border-color:#45dfaa55;color:#aaffdc}.btn.danger{background:#ff667d1a;border-color:#ff667d55;color:#ffc1cb}.btn.block{width:100%}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.span4{grid-column:span 4}.span6{grid-column:span 6}.span12{grid-column:span 12}.page{padding:48px 0 80px}.page h1{font-size:clamp(44px,6vw,70px)}.muted{color:var(--muted)}.field label{display:block;color:#b9c8d6;font-size:13px;margin:0 0 7px}.field input,.field select{width:100%;height:48px;background:#00000028;color:#fff;border:1px solid var(--line);border-radius:12px;padding:0 13px;outline:0}.field input:focus,.field select:focus{border-color:#22c7c988;box-shadow:0 0 0 3px #22c7c914}.status{padding:13px 15px;border:1px solid var(--line);border-radius:13px;margin-top:14px;background:#ffffff06}.status.ok{border-color:#45dfaa55;background:#45dfaa10}.status.err{border-color:#ff667d55;background:#ff667d10}.ticket{max-width:430px;margin:25px auto;background:#f5f8fb;color:#09111e;border-radius:28px;padding:15px}.ticket-top{background:linear-gradient(135deg,#07102b,#1b2c70);color:#eaffff;border-radius:21px;padding:22px}.ticket h2{font:700 30px 'Space Grotesk';margin:12px 0 2px}.ticket-qr{width:82%;aspect-ratio:1;margin:16px auto;background:#fff;border-radius:16px;padding:12px}.ticket-qr img{width:100%;height:100%;object-fit:contain}.trow{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:1px solid #d9e2e9;font-size:13px}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{border:1px solid var(--line);border-radius:17px;padding:17px;background:#ffffff05}.stat b{display:block;font:700 31px 'Space Grotesk';margin-top:5px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}.table th{color:#9db0c3}.badge{display:inline-block;padding:5px 8px;border-radius:99px;font-size:10px;font-weight:800}.pending{background:#ffc21a18;color:#ffda72}.verified{background:#45dfaa18;color:#8af1c9}.rejected,.used{background:#ff667d18;color:#ffb3be}.scannerbox{max-width:760px;margin:auto}.scanframe{min-height:320px;border:1px dashed #22c7c966;border-radius:20px;overflow:hidden;background:#00000025}.confirm{font-size:18px;min-height:58px}.hidden{display:none!important}.small{font-size:12px;color:var(--muted)}.center{text-align:center}footer{padding:36px 0 60px;color:#708398;font-size:11px}@media(max-width:800px){.hero{grid-template-columns:1fr;padding:46px 0 20px}.hero h1{font-size:53px}.nav{overflow:auto;flex-wrap:nowrap}.nav button{white-space:nowrap}.grid{grid-template-columns:1fr}.span4,.span6,.span12{grid-column:span 1}.statgrid{grid-template-columns:1fr 1fr}.card,.panel{padding:19px;border-radius:19px}.page{padding-top:34px}}@media(max-width:480px){.top{align-items:flex-start;padding:13px 0}.top{display:block}.nav{margin-top:12px}.hero h1{font-size:45px}.statgrid{grid-template-columns:1fr}.ticket{margin-top:18px}}
</style></head><body><div class="shell"><header class="top"><a class="brand" href="#" onclick="show('home')"><span class="mark"></span><span><strong>INSOMNIA</strong><small>ENTRY PORTAL</small></span></a><nav class="nav"><button id="nav-home" onclick="show('home')">Home</button><button id="nav-ticket" onclick="show('ticket')">Get Pass</button><button id="nav-cr" onclick="show('cr')">CR Verification</button><button id="nav-scan" onclick="show('scanner')">Gate Scanner</button><button id="nav-admin" onclick="show('admin')">Admin</button></nav></header>
<main id="app"></main><footer>INSOMNIA · THREE NIGHTS · ONE PASS · RESTRICTED NIGHT ENTRY</footer></div>
<script>
const $=id=>document.getElementById(id);let state={view:'home',session:null,scan:null};
function esc(s){return String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[m]))}
function call(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(e))[fn](...args))}
function show(v){state.view=v;['home','ticket','cr','scanner','admin'].forEach(x=>$('nav-'+x).classList.toggle('active',x===v)); if(v==='home')home();if(v==='ticket')ticketPage();if(v==='cr')crPage();if(v==='scanner')scannerPage();if(v==='admin')adminPage()}
function home(){ $('app').innerHTML=`<section class="hero"><section><div class="eyebrow">THREE NIGHTS · ONE PASS</div><h1>Secure entry.<br><span>One verified ticket.</span></h1><p class="lead">Pay your assigned CR, submit the registration form, and wait for payment verification. Your unique pass appears here only after approval. At the gate, show the QR and your college ID.</p><div class="actions"><button class="btn primary" onclick="show('ticket')">Retrieve Pass</button><button class="btn" onclick="show('scanner')">Gate Scanner</button></div></section><section class="card hero-card"><div><div class="eyebrow">LIVE CHECK</div><div class="mockqr">QR</div><p class="small">One confirmed entry per night · No re-entry</p></div></section></section><section class="grid"><article class="card span4"><div class="eyebrow">01</div><h2>Pay & submit</h2><p class="muted">Pay your batch CR and enter the UTR in the registration form.</p></article><article class="card span4"><div class="eyebrow">02</div><h2>CR verifies</h2><p class="muted">Your CR checks the UTR in the actual UPI transaction history.</p></article><article class="card span4"><div class="eyebrow">03</div><h2>Scan & confirm</h2><p class="muted">The gate scanner checks the live sheet and consumes that night only after confirmation.</p></article></section>`}
function ticketPage(){ $('app').innerHTML=`<section class="page"><div class="eyebrow">PASS RETRIEVAL</div><h1>Get your pass.</h1><p class="lead">Enter the same mobile number and UTR used in the registration form.</p><section class="panel"><div class="grid"><div class="field span6"><label>Mobile number</label><input id="tmobile" inputmode="tel"></div><div class="field span6"><label>UTR number</label><input id="tutr" autocomplete="off"></div><div class="span12"><button class="btn primary block" onclick="retrieveTicket()">Show Pass</button></div></div><div id="tstatus"></div></section><div id="ticketout"></div></section>`}
async function retrieveTicket(){const st=$('tstatus');st.className='status';st.textContent='Checking verification…';try{const r=await call('studentTicket',$('tmobile').value,$('tutr').value);if(!r.ok){st.className='status err';st.textContent=r.message;return}st.className='status ok';st.textContent='Pass verified.';const t=r.ticket;$('ticketout').innerHTML=`<div class="ticket"><div class="ticket-top"><div class="eyebrow">INSOMNIA · NIGHT ENTRY</div><h2>${esc(t.name)}</h2><div class="small">${esc(t.batch)} · ${esc(t.rollNumber)}</div><div class="ticket-qr" id="ticketqr"></div></div><div class="trow"><b>Ticket ID</b><span>${esc(t.ticketId)}</span></div><div class="trow"><b>Validity</b><span>All 3 nights</span></div><div class="trow"><b>Entry rule</b><span>QR + College ID</span></div><p class="small center">Keep this pass ready at the gate. No re-entry.</p><button class="btn block" onclick="window.print()">Print / Save</button></div>`;new QRCode($('ticketqr'),{text:t.qrToken,width:330,height:330,colorDark:'#071020',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});}catch(e){st.className='status err';st.textContent=e.message}}
function loginBox(type){return `<section class="panel"><div class="grid"><div class="field span6"><label>${type==='ADMIN'?'Admin':'Username'}</label><input id="loginuser" ${type==='ADMIN'?'value="ADMIN" readonly':''}></div><div class="field span6"><label>Access code</label><input id="loginpin" type="password"></div><div class="span12"><button class="btn primary" onclick="doLogin('${type}')">Sign In</button></div></div><div id="logstatus"></div></section>`}
async function doLogin(type){const st=$('logstatus');st.className='status';st.textContent='Signing in…';try{const r=type==='ADMIN'?await call('adminLogin',$('loginpin').value):await call('login',$('loginuser').value,$('loginpin').value);if(!r.ok){st.className='status err';st.textContent=r.message;return}state.session=r; if(type==='ADMIN')adminDash();else if(type==='CR')crDash();else scannerDash()}catch(e){st.className='status err';st.textContent=e.message}}
function crPage(){ $('app').innerHTML=`<section class="page"><div class="eyebrow">PAYMENT CONTROL</div><h1>CR Verification</h1><p class="lead">Only the assigned batch CR should verify the UTR against the actual UPI transaction.</p><div id="crbox">${loginBox('CR')}</div></section>`}
async function crDash(){const r=await call('crList',state.session.token);$('crbox').innerHTML=`<div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><div class="eyebrow">${esc(state.session.batch)}</div><h2>${esc(state.session.name)}</h2></div><button class="btn" onclick="state.session=null;crPage()">Sign out</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Student</th><th>UTR</th><th>Paid to</th><th>Status</th><th>Action</th></tr></thead><tbody>${r.map(x=>`<tr><td><b>${esc(x.name)}</b><br><span class="small">${esc(x.rollNumber)} · ${esc(x.mobile)}</span></td><td>${esc(x.utr)}</td><td>${esc(x.paidTo)}</td><td><span class="badge ${x.paymentStatus.toLowerCase()}">${esc(x.paymentStatus)}</span></td><td>${x.paymentStatus==='PENDING'?`<button class="btn success" onclick="verify('${x.registrationId}','VERIFY')">VERIFY</button> <button class="btn danger" onclick="verify('${x.registrationId}','REJECT')">REJECT</button>`:esc(x.ticketId||'—')}</td></tr>`).join('')}</tbody></table></div></div>`}
async function verify(id,d){if(!confirm(d==='VERIFY'?'Verify this UTR and generate the ticket?':'Reject this registration?'))return;try{alert((await call('verifyPayment',state.session.token,id,d,'' )).message);crDash()}catch(e){alert(e.message)}}
function scannerPage(){ $('app').innerHTML=`<section class="page scannerbox"><div class="eyebrow">LIVE GATE CONTROL</div><h1>Gate Scanner</h1><p class="lead">Four phones are supported: BOYS-01/02 and GIRLS-01/02. Check college ID before confirming.</p><div id="scanbox">${loginBox('SCANNER')}</div></section>`}
async function scannerDash(){ $('scanbox').innerHTML=`<div class="panel"><div class="grid"><div class="field span6"><label>Gate</label><select id="gate"><option>BOYS</option><option>GIRLS</option></select></div><div class="field span6"><label>Night</label><select id="night"><option>NIGHT 1</option><option>NIGHT 2</option><option>NIGHT 3</option></select></div></div><div class="actions"><button class="btn primary" onclick="startScanner()">Start Camera</button><button class="btn" onclick="state.session=null;scannerPage()">Sign out</button></div><div id="reader" class="scanframe" style="margin-top:16px"></div><div id="scanresult"></div><div id="confirmarea"></div></div>`; $('gate').value=state.session.gate;}
let scannerObj=null;function startScanner(){if(scannerObj)scannerObj.stop().catch(()=>{});scannerObj=new Html5Qrcode('reader');scannerObj.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},text=>handleScan(text),()=>{}).catch(e=>{ $('scanresult').className='status err';$('scanresult').textContent='Camera could not start. Allow camera access and use HTTPS.';});}
async function handleScan(qr){if(state.scan&&state.scan.qrToken===qr)return;state.scan={qrToken:qr};try{const r=await call('validateQr',state.session.token,qr,$('night').value,$('gate').value);$('scanresult').className='status '+(r.ok?'ok':'err');$('scanresult').textContent=r.message; if(r.ok){$('confirmarea').innerHTML=`<div class="card" style="margin-top:12px"><h2>${esc(r.name)}</h2><p class="muted">${esc(r.batch)} · ${esc(r.ticketId)}</p><p><b>Check college ID before continuing.</b></p><button class="btn primary block confirm" onclick="confirmEntryNow()">CONFIRM ENTRY</button></div>`}else $('confirmarea').innerHTML='';}catch(e){$('scanresult').className='status err';$('scanresult').textContent=e.message}}
async function confirmEntryNow(){try{const r=await call('confirmEntry',state.session.token,state.scan.qrToken,$('night').value,$('gate').value,'College ID checked');$('confirmarea').innerHTML=`<div class="status ${r.ok?'ok':'err'}">${esc(r.message)}</div>`;state.scan=null;}catch(e){$('confirmarea').innerHTML=`<div class="status err">${esc(e.message)}</div>`}}
function adminPage(){ $('app').innerHTML=`<section class="page"><div class="eyebrow">SYSTEM CONTROL</div><h1>Admin</h1><p class="lead">Manage the simple Google Sheet backend from one mobile-friendly portal.</p><div id="adminbox">${loginBox('ADMIN')}</div></section>`}
async function adminDash(){const [d,u]=await Promise.all([call('dashboard',state.session.token),call('listUsers',state.session.token)]);$('adminbox').innerHTML=`<div class="statgrid"><div class="stat"><span class="small">Registrations</span><b>${d.stats.registrations}</b></div><div class="stat"><span class="small">Pending</span><b>${d.stats.pending}</b></div><div class="stat"><span class="small">Verified</span><b>${d.stats.verified}</b></div><div class="stat"><span class="small">Entries</span><b>${d.stats.entries}</b></div></div><section class="panel" style="margin-top:14px"><div style="display:flex;justify-content:space-between;gap:10px"><div><div class="eyebrow">CURRENT NIGHT</div><h2>Entry settings</h2></div><button class="btn" onclick="state.session=null;adminPage()">Sign out</button></div><div class="actions"><button class="btn" onclick="setNight('NIGHT 1')">Night 1</button><button class="btn" onclick="setNight('NIGHT 2')">Night 2</button><button class="btn" onclick="setNight('NIGHT 3')">Night 3</button></div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3>Add CR / Scanner</h3><div class="grid"><div class="field span4"><label>Username</label><input id="nu"></div><div class="field span4"><label>Name</label><input id="nn"></div><div class="field span4"><label>Access code</label><input id="np" type="password"></div><div class="field span4"><label>Role</label><select id="nr"><option>CR</option><option>SCANNER</option></select></div><div class="field span4"><label>Batch</label><input id="nb" placeholder="e.g. 2026"></div><div class="field span4"><label>Gate</label><select id="ng"><option></option><option>BOYS</option><option>GIRLS</option></select></div><div class="span12"><button class="btn primary" onclick="addUser()">Create user</button></div></div><p class="small">CR access is batch-limited. Scanner access is gate-limited.</p></section><section class="panel"><div class="eyebrow">USERS</div><div class="tablewrap"><table class="table"><thead><tr><th>Username</th><th>Name</th><th>Role</th><th>Batch</th><th>Gate</th></tr></thead><tbody>${u.map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(x.name)}</td><td>${esc(x.role)}</td><td>${esc(x.batch)}</td><td>${esc(x.gate)}</td></tr>`).join('')}</tbody></table></div></section><section class="panel"><div class="eyebrow">LATEST REGISTRATIONS</div><div class="tablewrap"><table class="table"><thead><tr><th>Student</th><th>Batch</th><th>UTR</th><th>Status</th></tr></thead><tbody>${d.rows.map(x=>`<tr><td>${esc(x.name)}<br><span class="small">${esc(x.mobile)}</span></td><td>${esc(x.batch)}</td><td>${esc(x.utr)}</td><td>${esc(x.paymentStatus)}</td></tr>`).join('')}</tbody></table></div></section>`}
async function addUser(){try{await call('createUser',state.session.token,{username:$('nu').value,name:$('nn').value,pin:$('np').value,role:$('nr').value,batch:$('nb').value,gate:$('ng').value});alert('User created.');adminDash()}catch(e){alert(e.message)}}
async function setNight(n){try{await call('setNight',state.session.token,n);alert('Current night set to '+n)}catch(e){alert(e.message)}}
show('home');
</script></body></html>
